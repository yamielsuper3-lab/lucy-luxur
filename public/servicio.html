<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Servicio | Delinearte by Lucy González</title>
    
    <!-- Hojas de Estilo -->
    <link rel="stylesheet" href="style.css?v=2.3">
    
    <!-- Fuentes Tipográficas Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos Exclusivos para la Página de Detalles del Servicio */
        body {
            background-color: var(--oled-black);
            color: var(--text-primary);
            font-family: var(--font-sans);
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        /* Fondo Decorativo de Autor */
        .service-page-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(135deg, #050505 0%, #000000 100%);
        }

        /* Flores de Magnolia Decorativas en el Fondo */
        .decor-magnolia {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 250px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
            filter: grayscale(30%);
            animation: float-slow 8s infinite alternate ease-in-out;
        }

        @keyframes float-slow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(15px) rotate(3deg); }
        }

        /* Botón de Regresar Flotante */
        .back-nav-btn {
            position: fixed;
            top: 2rem;
            left: 3rem;
            background: rgba(10, 10, 10, 0.7);
            border: var(--hairline-border);
            padding: 0.8rem 1.4rem;
            border-radius: 30px;
            color: var(--brushed-gold);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: var(--transition-fast);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .back-nav-btn:hover {
            background: var(--brushed-gold);
            color: var(--oled-black);
            transform: translateX(-5px);
            box-shadow: 0 4px 15px var(--glow-color);
        }

        /* Contenedor Editorial Split-Screen (50/50) */
        .service-detail-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Columna Izquierda (Imagen Fija de Alta Costura) */
        .service-image-block {
            position: fixed;
            top: 0;
            left: 0;
            width: 50%;
            height: 100vh;
            padding: 0;
            margin: 0;
            border: none;
            box-shadow: none;
            z-index: 10;
            background: #000;
            overflow: hidden;
        }

        .service-detail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            display: block;
            border-right: 1px solid rgba(197, 160, 89, 0.25);
        }

        /* Columna Derecha (Contenido Desplazable) */
        .service-info-block {
            width: 50%;
            margin-left: 50%;
            padding: 6rem 6% 6rem 6%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background-color: var(--oled-black);
            z-index: 5;
        }

        .service-pre-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--brushed-gold);
            line-height: 1.2;
            margin-bottom: 0.4rem;
            letter-spacing: 0.05em;
            font-style: italic;
        }

        .service-main-title {
            font-family: var(--font-serif);
            font-size: 4rem;
            font-weight: 400; /* Delicado y elegante */
            color: var(--text-primary);
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
            text-transform: capitalize;
        }

        /* Tarjeta de Especificaciones de Canva */
        .canva-spec-card {
            padding: 2.2rem;
            border-radius: 8px;
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .canva-spec-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background-color: var(--brushed-gold);
        }

        .service-desc-text {
            font-size: 1.05rem;
            line-height: 1.7;
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
        }

        .meta-spec-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(197, 160, 89, 0.15);
        }

        .meta-spec-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 400;
        }

        .meta-spec-icon {
            color: var(--brushed-gold);
            font-size: 1.2rem;
        }

        /* Insignia de Precio */
        .canva-price-badge {
            align-self: flex-start;
            position: relative;
            overflow: hidden;
            z-index: 1;
            background: transparent;
            color: var(--brushed-gold);
            border: 1px solid var(--brushed-gold);
            padding: 0.9rem 2.2rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 25px rgba(197, 160, 89, 0.1);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
        }

        .canva-price-badge::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--brushed-gold) 0%, #a27c39 100%);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .canva-price-badge:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .canva-price-badge:hover {
            color: var(--oled-black);
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.5);
            transform: scale(1.03);
        }

        .price-badge-label {
            font-weight: 300;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.8;
            border-left: 1px solid rgba(197, 160, 89, 0.3);
            padding-left: 1rem;
            transition: border-color 0.4s ease;
        }

        .canva-price-badge:hover .price-badge-label {
            border-left-color: rgba(0, 0, 0, 0.25);
        }

        /* Sección de Pasos Estilo Editorial (Con líneas finas y números elegantes) */
        .process-steps-section {
            margin-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 2.5rem;
        }

        .section-header-small {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--brushed-gold);
            margin-bottom: 1.8rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .detail-steps-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .detail-step-card {
            display: flex;
            gap: 1.8rem;
            align-items: flex-start;
            padding: 1.8rem 0;
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition-fast);
        }

        .detail-step-card:hover {
            border-bottom-color: var(--brushed-gold);
        }

        .detail-step-num {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--brushed-gold);
            font-weight: 300;
            line-height: 1;
            opacity: 0.85;
            flex-shrink: 0;
        }

        .detail-step-content h4 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .detail-step-content p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 300;
        }

        /* Sección de Beneficios y Cuidados */
        .benefits-care-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: 3.5rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 3rem;
        }

        .block-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .block-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .block-list li::before {
            content: '▪';
            position: absolute;
            left: 0;
            color: var(--brushed-gold);
            font-size: 1.2rem;
            line-height: 1;
            top: -2px;
        }

        /* Fila de Acción CTA */
        .cta-action-row {
            margin-top: 4rem;
            display: flex;
            justify-content: flex-start;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 3rem;
        }

        .cta-large-btn {
            position: relative;
            overflow: hidden;
            z-index: 1;
            padding: 1.2rem 4rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: transparent;
            color: var(--brushed-gold);
            border: 1px solid var(--brushed-gold);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.15);
            transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
        }

        .cta-large-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--brushed-gold);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .cta-large-btn:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .cta-large-btn:hover {
            color: var(--oled-black);
            border-color: transparent;
            box-shadow: 0 8px 30px rgba(197, 160, 89, 0.6);
            transform: translateY(-3px);
        }

        /* Responsividad */
        @media (max-width: 992px) {
            .service-detail-container {
                flex-direction: column;
                width: 100%;
            }
            .service-image-block {
                position: relative;
                top: 0;
                left: 0;
                width: 100%;
                height: 45vh;
                z-index: 10;
            }
            .service-detail-img {
                border-right: none;
                border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            }
            .service-info-block {
                width: 100%;
                margin-left: 0;
                padding: 3rem 1.5rem 4rem 1.5rem;
                min-height: auto;
            }
            .back-nav-btn {
                top: 1.5rem;
                left: 1.5rem;
                padding: 0.6rem 1.2rem;
                font-size: 0.75rem;
            }
            .benefits-care-grid {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }
        }

        /* Botones de Navegación Deslizable */
        .nav-arrow-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid var(--brushed-gold);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: var(--brushed-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 100;
            cursor: pointer;
            transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
            overflow: hidden;
        }

        .nav-arrow-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--brushed-gold);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .nav-arrow-btn.prev-arrow {
            left: 3%;
        }
        
        .nav-arrow-btn.next-arrow {
            right: 3%;
        }

        .nav-arrow-btn.prev-arrow::after {
            transform-origin: left;
        }

        .nav-arrow-btn.next-arrow::after {
            transform-origin: right;
        }

        .nav-arrow-btn:hover::after {
            transform: scaleX(1);
        }
        
        .nav-arrow-btn.prev-arrow:hover::after {
            transform-origin: right;
        }
        
        .nav-arrow-btn.next-arrow:hover::after {
            transform-origin: left;
        }

        .nav-arrow-btn:hover {
            color: var(--oled-black);
            border-color: transparent;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
        }
        
        .nav-arrow-btn.prev-arrow:hover {
            transform: translateY(-50%) translateX(-5px);
        }
        
        .nav-arrow-btn.next-arrow:hover {
            transform: translateY(-50%) translateX(5px);
        }

        .arrow-svg {
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .nav-arrow-btn.prev-arrow:hover .arrow-svg {
            transform: translateX(-2px);
        }

        .nav-arrow-btn.next-arrow:hover .arrow-svg {
            transform: translateX(2px);
        }

        /* Animaciones para la transición de servicios */
        .service-detail-container {
            opacity: 0;
            animation: elegantFadeUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .service-detail-container.slide-from-right {
            opacity: 0;
            animation: elegantSlideFromRight 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .service-detail-container.slide-from-left {
            opacity: 0;
            animation: elegantSlideFromLeft 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes elegantFadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes elegantSlideFromRight {
            from {
                opacity: 0;
                transform: translateX(80px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes elegantSlideFromLeft {
            from {
                opacity: 0;
                transform: translateX(-80px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsividad para móviles */
        @media (max-width: 768px) {
            .nav-arrow-btn {
                width: 45px;
                height: 45px;
                background: rgba(0, 0, 0, 0.7);
                top: auto;
                bottom: 20px;
                transform: none;
            }
            .nav-arrow-btn.prev-arrow {
                left: 20px;
            }
            .nav-arrow-btn.next-arrow {
                right: 20px;
            }
            .nav-arrow-btn.prev-arrow:hover {
                transform: translateX(-3px);
            }
            
            .nav-arrow-btn.next-arrow:hover {
                transform: translateX(3px);
            }
        }

        /* Estilos para el Efecto de Disolución Cristalina */
        .service-image-block {
            overflow: hidden;
        }

        .service-detail-img {
            transition: filter 0.8s ease, transform 0.8s ease;
        }

        .crystalline-grid-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
            display: grid;
        }

        .crystalline-cell {
            position: relative;
            background-repeat: no-repeat;
            box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.15), inset -1px -1px 0px rgba(0, 0, 0, 0.2);
            border: 0.5px solid rgba(197, 160, 89, 0.12); /* Cuadrícula dorada muy sutil */
            transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
            opacity: 1;
            filter: blur(0px) brightness(1);
            transition: transform 1.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 1.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        filter 1.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform, opacity, filter;
        }

        .crystalline-cell.shattered {
            opacity: 0;
            filter: blur(6px) brightness(1.6) contrast(1.1); /* Resplandor brillante */
        }

        /* Vibración/Tremor de tensión de cristal antes de quebrarse */
        @keyframes crack-tremor {
            0%, 100% { transform: translate(0, 0) scale(1); filter: brightness(1); }
            10% { transform: translate(-2px, 2px) scale(1.005); filter: brightness(1.05); }
            30% { transform: translate(2px, -2px) scale(1.008); }
            50% { transform: translate(-1px, 1px) scale(1.01); filter: brightness(1.1); }
            70% { transform: translate(2px, 2px) scale(1.005); }
            90% { transform: translate(-2px, -1px) scale(1.002); }
        }

        .cracking {
            animation: crack-tremor 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body>

    <!-- Fondo de Autor -->
    <div class="service-page-bg">
        <!-- SVG Magnolia Decal o PNG de Respaldo -->
        <img src="Imagen.png" class="decor-magnolia" alt="Magnolia Decal">
    </div>

    <!-- Regresar a la Boutique -->
    <a href="/" class="back-nav-btn">
        <span>← Volver al Catálogo</span>
    </a>

    <!-- Botones de Navegación Deslizable entre Servicios -->
    <a id="prev-service-link" href="#" class="nav-arrow-btn prev-arrow" aria-label="Servicio Anterior">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-svg"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <a id="next-service-link" href="#" class="nav-arrow-btn next-arrow" aria-label="Siguiente Servicio">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-svg"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>

    <!-- Contenedor de Detalle Principal -->
    <div class="service-detail-container">
        
        <!-- Bloque de Imagen Izquierdo -->
        <div class="service-image-block">
            <img id="detail-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Servicio Premium" class="service-detail-img">
        </div>
        
        <!-- Bloque de Información Derecho -->
        <div class="service-info-block">
            
            <span id="detail-pre-title" class="service-pre-title">Facial</span>
            <h1 id="detail-main-title" class="service-main-title">Cargando Servicio...</h1>
            
            <!-- Insignia de Precio -->
            <div class="canva-price-badge">
                <span id="detail-price">$0</span>
                <span class="price-badge-label">Aplicación</span>
            </div>

            <!-- Tarjeta Canva de Descripción -->
            <div class="canva-spec-card glass-panel">
                <p id="detail-description" class="service-desc-text">
                    Cargando descripción detallada del tratamiento de autor de la boutique...
                </p>
                
                <div class="meta-spec-list">
                    <div class="meta-spec-item">
                        <span class="meta-spec-icon">🗓</span>
                        <span>Durabilidad: <strong id="detail-frequency">-</strong></span>
                    </div>
                    <div class="meta-spec-item">
                        <span class="meta-spec-icon">⏱</span>
                        <span>Tiempo de servicio: <strong id="detail-duration">-</strong></span>
                    </div>
                </div>
            </div>

            <!-- Línea de Proceso Paso a Paso -->
            <div class="process-steps-section">
                <h3 class="section-header-small">El Proceso de Autor</h3>
                <div id="detail-steps-list" class="detail-steps-grid">
                    <!-- Dinámico -->
                </div>
            </div>

            <!-- Beneficios y Cuidados Grid -->
            <div class="benefits-care-grid">
                
                <!-- Beneficios -->
                <div>
                    <h3 class="section-header-small">Beneficios Élite</h3>
                    <ul id="detail-benefits-list" class="block-list">
                        <!-- Dinámico -->
                    </ul>
                </div>
                
                <!-- Cuidados -->
                <div>
                    <h3 class="section-header-small">Cuidados Posteriores</h3>
                    <ul id="detail-care-list" class="block-list">
                        <!-- Dinámico -->
                    </ul>
                </div>

            </div>

            <!-- Fila CTA para Reservar -->
            <div class="cta-action-row">
                <a id="detail-cta-btn" href="/#reservas" class="cta-large-btn">
                    <span>Agendar Cita Ahora</span> 👑
                </a>
            </div>

        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Extraer el identificador del servicio de la URL
            const params = new URLSearchParams(window.location.search);
            const serviceId = params.get('id');
            const direction = params.get('dir');

            const container = document.querySelector('.service-detail-container');
            if (container) {
                if (direction === 'next') {
                    container.classList.add('slide-from-right');
                } else if (direction === 'prev') {
                    container.classList.add('slide-from-left');
                }
            }

            // Si no se proporciona ID, redirigir al catálogo
            if (!serviceId) {
                window.location.href = '/';
                return;
            }

            let data;
            try {
                const response = await fetch(`/api/services/${serviceId}`);
                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }
                data = await response.json();
            } catch (error) {
                console.error('Error fetching service:', error);
                window.location.href = '/';
                return;
            }

            // Rellenar datos principales
            document.title = `${data.title} | Delinearte by Lucy González`;
            
            // Separar el pre-título (categoría) del título principal para el efecto Canva
            let preTitleText = "Servicio";
            let mainTitleText = data.title;
            
            if (data.title.includes('Facial')) {
                preTitleText = "Facial";
                mainTitleText = data.title.replace(/faciales?/i, '').replace(/facial/i, '').trim();
            } else if (data.title.includes('Ceja') || data.title.includes('Mirada')) {
                preTitleText = "Mirada";
                mainTitleText = data.title.replace(/de cejas?/i, '').replace(/cejas?/i, '').replace(/miradas?/i, '').trim();
            } else if (data.title.includes('Uñas') || data.title.includes('Poligel') || data.title.includes('Soft Gel') || data.title.includes('Ruber')) {
                preTitleText = "Uñas Élite";
                mainTitleText = data.title;
            }

            document.getElementById('detail-pre-title').textContent = preTitleText;
            document.getElementById('detail-main-title').textContent = mainTitleText;
            
            // Asignar imagen (ocultar el bloque izquierdo y centrar si está vacío)
            const imgEl = document.getElementById('detail-img');
            const imgBlock = document.querySelector('.service-image-block');
            const infoBlock = document.querySelector('.service-info-block');
            
            if (data.image && data.image !== "") {
                imgEl.src = data.image;
                imgEl.alt = data.title;
            } else {
                if (imgBlock) imgBlock.style.display = 'none';
                if (infoBlock) {
                    infoBlock.style.width = '100%';
                    infoBlock.style.marginLeft = '0';
                    infoBlock.style.maxWidth = '800px';
                    infoBlock.style.margin = '0 auto';
                    infoBlock.style.paddingLeft = '5%';
                    infoBlock.style.paddingRight = '5%';
                }
            }

            // Precio y meta info
            document.getElementById('detail-price').textContent = data.price;
            document.getElementById('detail-description').textContent = data.description;
            document.getElementById('detail-frequency').textContent = data.frequency;
            document.getElementById('detail-duration').textContent = data.duration;

            // Renderizar pasos del proceso
            const stepsContainer = document.getElementById('detail-steps-list');
            stepsContainer.innerHTML = '';
            data.steps.forEach((step, idx) => {
                const card = document.createElement('div');
                card.className = 'detail-step-card';
                card.innerHTML = `
                    <div class="detail-step-num">${idx + 1}</div>
                    <div class="detail-step-content">
                        <h4>${step.title}</h4>
                        <p>${step.desc}</p>
                    </div>
                `;
                stepsContainer.appendChild(card);
            });

            // Renderizar lista de beneficios
            const benefitsContainer = document.getElementById('detail-benefits-list');
            benefitsContainer.innerHTML = '';
            data.benefits.forEach(benefit => {
                const li = document.createElement('li');
                li.textContent = benefit;
                benefitsContainer.appendChild(li);
            });

            // Renderizar lista de cuidados
            const careContainer = document.getElementById('detail-care-list');
            careContainer.innerHTML = '';
            data.aftercare.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                careContainer.appendChild(li);
            });

            // Configurar botón CTA de Reserva
            const ctaBtn = document.getElementById('detail-cta-btn');
            if (ctaBtn) {
                // Redirigir al formulario principal y pre-seleccionar este servicio específico
                ctaBtn.href = `/?select=${encodeURIComponent(data.stripe_service_id)}#reservas`;
            }

            // Configurar navegación deslizable de servicios
            try {
                const servicesResponse = await fetch('/api/services');
                if (servicesResponse.ok) {
                    const groupedServices = await servicesResponse.json();
                    
                    const allServices = [
                        ...(groupedServices.mirada || []),
                        ...(groupedServices.faciales || []),
                        ...(groupedServices.unas || [])
                    ];
                    
                    const currentIndex = allServices.findIndex(s => s.id === serviceId);
                    
                    if (currentIndex !== -1 && allServices.length > 1) {
                        const prevIndex = (currentIndex - 1 + allServices.length) % allServices.length;
                        const nextIndex = (currentIndex + 1) % allServices.length;
                        
                        const prevService = allServices[prevIndex];
                        const nextService = allServices[nextIndex];
                        
                        const prevLink = document.getElementById('prev-service-link');
                        const nextLink = document.getElementById('next-service-link');
                        
                        if (prevLink) {
                            prevLink.href = `servicio.html?id=${prevService.id}&dir=prev`;
                            prevLink.title = `Anterior: ${prevService.title}`;
                        }
                        if (nextLink) {
                            nextLink.href = `servicio.html?id=${nextService.id}&dir=next`;
                            nextLink.title = `Siguiente: ${nextService.title}`;
                        }
                    } else {
                        document.getElementById('prev-service-link')?.remove();
                        document.getElementById('next-service-link')?.remove();
                    }
                }
            } catch (err) {
                console.error('Error al configurar la navegación de servicios:', err);
                document.getElementById('prev-service-link')?.remove();
                document.getElementById('next-service-link')?.remove();
            }

            // Configurar navegación por teclado (flechas izquierda / derecha)
            document.addEventListener('keydown', (e) => {
                // Evitar navegación si el usuario está escribiendo en algún formulario
                const activeTag = document.activeElement.tagName.toLowerCase();
                if (activeTag === 'input' || activeTag === 'textarea' || document.activeElement.isContentEditable) {
                    return;
                }

                if (e.key === 'ArrowLeft') {
                    const prevLink = document.getElementById('prev-service-link');
                    if (prevLink && prevLink.getAttribute('href') !== '#') {
                        prevLink.click();
                    }
                } else if (e.key === 'ArrowRight') {
                    const nextLink = document.getElementById('next-service-link');
                    if (nextLink && nextLink.getAttribute('href') !== '#') {
                        nextLink.click();
                    }
                }
            });

            // ==========================================
            // EFECTO DE TRANSICIÓN DE GALERÍA CRISTALINA
            // ==========================================
            const GALLERY_MAPPING = {
                mirada: [
                    'microblading.jpeg',
                    'microblading_2.jpeg',
                    'powder_brows.jpeg',
                    'cejas_hd.jpeg',
                    'cejas_hd_2.jpeg',
                    'laminacion_cejas.jpeg',
                    'extension_pestanas_tecnica_clasica.jpeg',
                    'extension_pestanas_volumen.jpeg',
                    'extension_pestanas_volumen_soft.jpeg',
                    'lifting_pestanas.jpeg',
                    'aquarela_lips_micropigmentacion.jpeg',
                    'hidratante_lips.jpeg'
                ],
                faciales: [
                    'facial_limpieza_profunda.jpeg',
                    'facial_hidratante.jpeg',
                    'facial_despigmentante.jpeg',
                    'facial_antiedad.jpeg'
                ],
                unas: [
                    'gel_semipermanente.jpeg',
                    'poligel.jpeg',
                    'ruber_base.jpeg',
                    'soft_gel.jpeg',
                    'vitamina_nail.jpeg'
                ]
            };

            let galleryImages = [];
            let currentGalleryIndex = 0;
            let galleryInterval = null;

            // Inicializar la galería para este servicio
            if (data.image && data.image !== "") {
                galleryImages.push(data.image);
            }
            const catGallery = GALLERY_MAPPING[data.category] || [];
            catGallery.forEach(img => {
                // Evitar duplicar la imagen de portada
                if (img !== data.image && !img.includes(data.image)) {
                    galleryImages.push(img);
                }
            });

            // Si hay más de una imagen de galería, activar el carrusel de cristal
            if (galleryImages.length > 1 && imgBlock && imgEl) {
                startGallerySlideshow();
            }

            function startGallerySlideshow() {
                if (galleryInterval) clearInterval(galleryInterval);
                galleryInterval = setInterval(async () => {
                    const nextIndex = (currentGalleryIndex + 1) % galleryImages.length;
                    await triggerCrystallineShatter(galleryImages[currentGalleryIndex], galleryImages[nextIndex]);
                    currentGalleryIndex = nextIndex;
                }, 5000); // Cambiar cada 5 segundos
            }

            function triggerCrystallineShatter(fromUrl, toUrl) {
                return new Promise((resolve) => {
                    if (!imgBlock || !imgEl) return resolve();

                    // 1. Iniciar animación de vibración de quiebre (tremor)
                    imgBlock.classList.add('cracking');

                    setTimeout(() => {
                        // Quitar tremor
                        imgBlock.classList.remove('cracking');

                        // 2. Obtener dimensiones del contenedor de imagen
                        const width = imgBlock.offsetWidth;
                        const height = imgBlock.offsetHeight;

                        // Si las dimensiones son cero (contenedor oculto en móvil) no hacer shatter
                        if (width === 0 || height === 0) {
                            imgEl.src = toUrl;
                            return resolve();
                        }

                        // 3. Configurar dimensiones de la cuadrícula
                        const cols = 8;
                        const rows = 10;
                        const cellWidth = width / cols;
                        const cellHeight = height / rows;

                        const gridWrapper = document.createElement('div');
                        gridWrapper.className = 'crystalline-grid-wrapper';
                        gridWrapper.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                        gridWrapper.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
                        gridWrapper.style.width = `${width}px`;
                        gridWrapper.style.height = `${height}px`;

                        // 4. Crear los fragmentos
                        for (let r = 0; r < rows; r++) {
                            for (let c = 0; c < cols; c++) {
                                const cell = document.createElement('div');
                                cell.className = 'crystalline-cell';
                                cell.style.backgroundImage = `url('${fromUrl}')`;
                                cell.style.backgroundSize = `${width}px ${height}px`;
                                cell.style.backgroundPosition = `-${c * cellWidth}px -${r * cellHeight}px`;

                                // Retraso escalonado (staggered delay) desde el centro hacia afuera + factor aleatorio
                                const centerX = cols / 2;
                                const centerY = rows / 2;
                                const dist = Math.sqrt((c - centerX) ** 2 + (r - centerY) ** 2);
                                const delay = dist * 0.045 + Math.random() * 0.15;
                                cell.style.transitionDelay = `${delay}s`;

                                gridWrapper.appendChild(cell);
                            }
                        }

                        // 5. Cubrir la imagen con la cuadrícula de cristal
                        imgBlock.appendChild(gridWrapper);
                        
                        // Ocultar temporalmente la imagen base por debajo
                        imgEl.style.opacity = '0';

                        // 6. Cargar la nueva imagen en la base por debajo
                        imgEl.src = toUrl;

                        // 7. Disparar el shatter (dispersión cristalina de los fragmentos) en el siguiente frame
                        requestAnimationFrame(() => {
                            setTimeout(() => {
                                // Devolver opacidad a la imagen base
                                imgEl.style.opacity = '1';

                                const cells = gridWrapper.querySelectorAll('.crystalline-cell');
                                cells.forEach(cell => {
                                    cell.classList.add('shattered');
                                    
                                    // Direcciones de dispersión aleatoria 3D
                                    const randomX = (Math.random() - 0.5) * 160; 
                                    const randomY = (Math.random() - 0.5) * 160; 
                                    const randomScale = 0.15 + Math.random() * 0.35; 
                                    const randomRotate = (Math.random() - 0.5) * 240; 
                                    
                                    cell.style.transform = `translate3d(${randomX}px, ${randomY}px, 0) scale(${randomScale}) rotate(${randomRotate}deg)`;
                                });
                            }, 50);
                        });

                        // 8. Limpiar los fragmentos del DOM una vez terminada la animación
                        setTimeout(() => {
                            gridWrapper.remove();
                            resolve();
                        }, 2000);

                    }, 350); // Tiempo del tremor
                });
            }

            // Asegurar que el temporizador de la galería se destruya si salimos de la página o cambiamos de vista
            window.addEventListener('beforeunload', () => {
                if (galleryInterval) clearInterval(galleryInterval);
            });
        });
    </script>
</body>
</html>
