    <style>
        /* Estilos Exclusivos para la Página de Detalles del Servicio */
        body {
            background-color: var(--oled-black);
            color: var(--text-primary);
            font-family: var(--font-sans);
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        /* Fondo Decorativo de Autor */
        .service-page-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(135deg, #050505 0%, #000000 100%);
        }

        /* Flores de Magnolia Decorativas en el Fondo */
        .decor-magnolia {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 250px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
            filter: grayscale(30%);
            animation: float-slow 8s infinite alternate ease-in-out;
        }

        @keyframes float-slow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(15px) rotate(3deg); }
        }

        /* Botón de Regresar Flotante */
        .back-nav-btn {
            position: fixed;
            top: 2rem;
            left: 3rem;
            background: rgba(10, 10, 10, 0.7);
            border: var(--hairline-border);
            padding: 0.8rem 1.4rem;
            border-radius: 30px;
            color: var(--brushed-gold);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: var(--transition-fast);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .back-nav-btn:hover {
            background: var(--brushed-gold);
            color: var(--oled-black);
            transform: translateX(-5px);
            box-shadow: 0 4px 15px var(--glow-color);
        }

        /* Contenedor Editorial Split-Screen (50/50) */
        .service-detail-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Columna Izquierda (Imagen Fija de Alta Costura) */
        .service-image-block {
            position: fixed;
            top: 0;
            left: 0;
            width: 50%;
            height: 100vh;
            padding: 0;
            margin: 0;
            border: none;
            box-shadow: none;
            z-index: 10;
            background: #000;
            overflow: hidden;
        }

        .service-detail-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            display: block;
            border-right: 1px solid rgba(197, 160, 89, 0.25);
            transition: opacity 1.6s cubic-bezier(0.25, 1, 0.5, 1);
            animation: elegantKenBurns 16s infinite alternate ease-in-out;
            will-change: transform, opacity;
        }

        .detail-img-back {
            z-index: 1;
        }

        .detail-img-front {
            z-index: 2;
        }

        /* Animación Ken Burns refinada (zoom y paneo extremadamente lentos) */
        @keyframes elegantKenBurns {
            0% {
                transform: scale(1.02) translate(0, 0);
            }
            100% {
                transform: scale(1.08) translate(-0.8%, -0.8%);
            }
        }

        /* Columna Derecha (Contenido Desplazable) */
        .service-info-block {
            width: 50%;
            margin-left: 50%;
            padding: 6rem 6% 6rem 6%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background-color: var(--oled-black);
            z-index: 5;
        }

        .service-pre-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--brushed-gold);
            line-height: 1.2;
            margin-bottom: 0.4rem;
            letter-spacing: 0.05em;
            font-style: italic;
        }

        .service-main-title {
            font-family: var(--font-serif);
            font-size: 4rem;
            font-weight: 400; /* Delicado y elegante */
            color: var(--text-primary);
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
            text-transform: capitalize;
        }

        /* Tarjeta de Especificaciones de Canva */
        .canva-spec-card {
            padding: 2.2rem;
            border-radius: 8px;
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .canva-spec-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background-color: var(--brushed-gold);
        }

        .service-desc-text {
            font-size: 1.05rem;
            line-height: 1.7;
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
        }

        .meta-spec-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(197, 160, 89, 0.15);
        }

        .meta-spec-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 400;
        }

        .meta-spec-icon {
            color: var(--brushed-gold);
            font-size: 1.2rem;
        }

        /* Insignia de Precio */
        .canva-price-badge {
            align-self: flex-start;
            position: relative;
            overflow: hidden;
            z-index: 1;
            background: transparent;
            color: var(--brushed-gold);
            border: 1px solid var(--brushed-gold);
            padding: 0.9rem 2.2rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 25px rgba(197, 160, 89, 0.1);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
        }

        .canva-price-badge::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--brushed-gold) 0%, #a27c39 100%);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .canva-price-badge:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .canva-price-badge:hover {
            color: var(--oled-black);
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.5);
            transform: scale(1.03);
        }

        .price-badge-label {
            font-weight: 300;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.8;
            border-left: 1px solid rgba(197, 160, 89, 0.3);
            padding-left: 1rem;
            transition: border-color 0.4s ease;
        }

        .canva-price-badge:hover .price-badge-label {
            border-left-color: rgba(0, 0, 0, 0.25);
        }

        /* Sección de Pasos Estilo Editorial (Con líneas finas y números elegantes) */
        .process-steps-section {
            margin-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 2.5rem;
        }

        .section-header-small {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--brushed-gold);
            margin-bottom: 1.8rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .detail-steps-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .detail-step-card {
            display: flex;
            gap: 1.8rem;
            align-items: flex-start;
            padding: 1.8rem 0;
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition-fast);
        }

        .detail-step-card:hover {
            border-bottom-color: var(--brushed-gold);
        }

        .detail-step-num {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--brushed-gold);
            font-weight: 300;
            line-height: 1;
            opacity: 0.85;
            flex-shrink: 0;
        }

        .detail-step-content h4 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .detail-step-content p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 300;
        }

        /* Sección de Beneficios y Cuidados */
        .benefits-care-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: 3.5rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 3rem;
        }

        .block-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .block-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .block-list li::before {
            content: '▪';
            position: absolute;
            left: 0;
            color: var(--brushed-gold);
            font-size: 1.2rem;
            line-height: 1;
            top: -2px;
        }

        /* Fila de Acción CTA */
        .cta-action-row {
            margin-top: 4rem;
            display: flex;
            justify-content: flex-start;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 3rem;
        }

        .cta-large-btn {
            position: relative;
            overflow: hidden;
            z-index: 1;
            padding: 1.2rem 4rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: transparent;
            color: var(--brushed-gold);
            border: 1px solid var(--brushed-gold);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.15);
            transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
        }

        .cta-large-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--brushed-gold);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .cta-large-btn:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .cta-large-btn:hover {
            color: var(--oled-black);
            border-color: transparent;
            box-shadow: 0 8px 30px rgba(197, 160, 89, 0.6);
            transform: translateY(-3px);
        }

        /* Responsividad */
        @media (max-width: 992px) {
            .service-detail-container {
                flex-direction: column;
                width: 100%;
            }
            .service-image-block {
                position: relative;
                top: 0;
                left: 0;
                width: 100%;
                height: 45vh;
                z-index: 10;
            }
            .service-detail-img {
                border-right: none;
                border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            }
            .service-info-block {
                width: 100%;
                margin-left: 0;
                padding: 3rem 1.5rem 4rem 1.5rem;
                min-height: auto;
            }
            .back-nav-btn {
                top: 1.5rem;
                left: 1.5rem;
                padding: 0.6rem 1.2rem;
                font-size: 0.75rem;
            }
            .benefits-care-grid {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }
        }

        /* Botones de Navegación Deslizable */
        .nav-arrow-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid var(--brushed-gold);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: var(--brushed-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 100;
            cursor: pointer;
            transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
            overflow: hidden;
        }

        .nav-arrow-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--brushed-gold);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .nav-arrow-btn.prev-arrow {
            left: 3%;
        }
        
        .nav-arrow-btn.next-arrow {
            right: 3%;
        }

        .nav-arrow-btn.prev-arrow::after {
            transform-origin: left;
        }

        .nav-arrow-btn.next-arrow::after {
            transform-origin: right;
        }

        .nav-arrow-btn:hover::after {
            transform: scaleX(1);
        }
        
        .nav-arrow-btn.prev-arrow:hover::after {
            transform-origin: right;
        }
        
        .nav-arrow-btn.next-arrow:hover::after {
            transform-origin: left;
        }

        .nav-arrow-btn:hover {
            color: var(--oled-black);
            border-color: transparent;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
        }
        
        .nav-arrow-btn.prev-arrow:hover {
            transform: translateY(-50%) translateX(-5px);
        }
        
        .nav-arrow-btn.next-arrow:hover {
            transform: translateY(-50%) translateX(5px);
        }

        .arrow-svg {
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .nav-arrow-btn.prev-arrow:hover .arrow-svg {
            transform: translateX(-2px);
        }

        .nav-arrow-btn.next-arrow:hover .arrow-svg {
            transform: translateX(2px);
        }

        /* Animaciones para la transición de servicios */
        /* Animaciones para la transición de la columna de información (derecha) */
        .service-info-block {
            opacity: 0;
            animation: elegantFadeUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .service-info-block.slide-from-right {
            opacity: 0;
            animation: elegantSlideFromRight 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .service-info-block.slide-from-left {
            opacity: 0;
            animation: elegantSlideFromLeft 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Animación suave para la imagen de la izquierda (sin transform para no romper position: fixed) */
        .service-image-block {
            opacity: 0;
            animation: elegantFadeIn 0.8s ease forwards;
        }

        @keyframes elegantFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes elegantFadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes elegantSlideFromRight {
            from {
                opacity: 0;
                transform: translateX(80px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes elegantSlideFromLeft {
            from {
                opacity: 0;
                transform: translateX(-80px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsividad para móviles */
        @media (max-width: 768px) {
            .nav-arrow-btn {
                width: 45px;
                height: 45px;
                background: rgba(0, 0, 0, 0.7);
                top: auto;
                bottom: 20px;
                transform: none;
            }
            .nav-arrow-btn.prev-arrow {
                left: 20px;
            }
            .nav-arrow-btn.next-arrow {
                right: 20px;
            }
            .nav-arrow-btn.prev-arrow:hover {
                transform: translateX(-3px);
            }
            
            .nav-arrow-btn.next-arrow:hover {
                transform: translateX(3px);
            }
        }

        /* Removido efecto de quiebre cristalino anterior */
    </style>

    <script>
        // Store original service data globally
        let originalServiceData = null;
        let serviceId = null;

        function renderServiceDetails(rawData) {
            if (!rawData) return;
            
            let data = { ...rawData };
            const isEn = (typeof currentLanguage !== 'undefined' ? currentLanguage : (localStorage.getItem('lang') || 'es')) === 'en';
            
            if (isEn && typeof TRANSLATIONS_SERVICES !== 'undefined' && TRANSLATIONS_SERVICES[serviceId]) {
                const trans = TRANSLATIONS_SERVICES[serviceId];
                data = {
                    ...data,
                    title: trans.title || data.title,
                    subtitle: trans.subtitle || data.subtitle,
                    price: trans.price || data.price,
                    duration: trans.duration || data.duration,
                    frequency: trans.frequency || data.frequency,
                    description: trans.description || data.description,
                    benefits: trans.benefits || data.benefits,
                    steps: trans.steps || data.steps,
                    aftercare: trans.aftercare || data.aftercare
                };
            }

            // Rellenar datos principales
            document.title = `${data.title} | Delinearte by Lucy González`;
            
            // Separar el pre-título (categoría) del título principal para el efecto Canva
            let preTitleText = isEn ? "Service" : "Servicio";
            let mainTitleText = data.title;
            
            if (data.title.toLowerCase().includes('facial') || data.title.toLowerCase().includes('skin') || data.title.toLowerCase().includes('cleansing') || data.title.toLowerCase().includes('peeling')) {
                preTitleText = isEn ? "Facial" : "Facial";
                mainTitleText = data.title.replace(/faciales?/i, '').replace(/facial/i, '').replace(/Skin/i, '').replace(/Cleansing/i, '').replace(/\s+/g, ' ').trim();
            } else if (data.title.toLowerCase().includes('ceja') || data.title.toLowerCase().includes('mirada') || data.title.toLowerCase().includes('eyebrow') || data.title.toLowerCase().includes('lash') || data.title.toLowerCase().includes('lips') || data.title.toLowerCase().includes('micropigmentaci')) {
                preTitleText = isEn ? "Gaze" : "Mirada";
                mainTitleText = data.title.replace(/de cejas?/i, '').replace(/cejas?/i, '').replace(/miradas?/i, '').replace(/Eyebrows?/i, '').replace(/Lash(es)?/i, '').replace(/Lips?/i, '').replace(/\s+/g, ' ').trim();
            } else if (data.title.toLowerCase().includes('uñas') || data.title.toLowerCase().includes('poligel') || data.title.toLowerCase().includes('soft gel') || data.title.toLowerCase().includes('ruber') || data.title.toLowerCase().includes('nail') || data.title.toLowerCase().includes('gel') || data.title.toLowerCase().includes('vitamina')) {
                preTitleText = isEn ? "Elite Nails" : "Uñas Élite";
                mainTitleText = data.title;
            }

            document.getElementById('detail-pre-title').textContent = preTitleText;
            document.getElementById('detail-main-title').textContent = mainTitleText;
            
            // Asignar imagen (ocultar el bloque izquierdo y centrar si está vacío)
            const imgEl = document.getElementById('detail-img-front');
            const imgElBack = document.getElementById('detail-img-back');
            const imgBlock = document.querySelector('.service-image-block');
            const infoBlock = document.querySelector('.service-info-block');
            
            if (data.image && data.image !== "") {
                if (imgBlock) imgBlock.style.display = '';
                if (infoBlock) {
                    infoBlock.style.width = '';
                    infoBlock.style.marginLeft = '';
                    infoBlock.style.maxWidth = '';
                    infoBlock.style.margin = '';
                    infoBlock.style.paddingLeft = '';
                    infoBlock.style.paddingRight = '';
                }
                if (imgEl) {
                    imgEl.src = data.image;
                    imgEl.alt = data.title;
                }
                if (imgElBack) {
                    imgElBack.src = data.image;
                    imgElBack.alt = data.title;
                }
            } else {
                if (imgBlock) imgBlock.style.display = 'none';
                if (infoBlock) {
                    infoBlock.style.width = '100%';
                    infoBlock.style.marginLeft = '0';
                    infoBlock.style.maxWidth = '800px';
                    infoBlock.style.margin = '0 auto';
                    infoBlock.style.paddingLeft = '5%';
                    infoBlock.style.paddingRight = '5%';
                }
            }

            // Precio y meta info
            document.getElementById('detail-price').textContent = data.price;
            document.getElementById('detail-description').textContent = data.description;
            document.getElementById('detail-frequency').textContent = data.frequency;
            document.getElementById('detail-duration').textContent = data.duration;

            // Renderizar pasos del proceso
            const stepsContainer = document.getElementById('detail-steps-list');
            stepsContainer.innerHTML = '';
            data.steps.forEach((step, idx) => {
                const card = document.createElement('div');
                card.className = 'detail-step-card';
                card.innerHTML = `
                    <div class="detail-step-num">${idx + 1}</div>
                    <div class="detail-step-content">
                        <h4>${step.title}</h4>
                        <p>${step.desc}</p>
                    </div>
                `;
                stepsContainer.appendChild(card);
            });

            // Renderizar lista de beneficios
            const benefitsContainer = document.getElementById('detail-benefits-list');
            benefitsContainer.innerHTML = '';
            data.benefits.forEach(benefit => {
                const li = document.createElement('li');
                li.textContent = benefit;
                benefitsContainer.appendChild(li);
            });

            // Renderizar lista de cuidados
            const careContainer = document.getElementById('detail-care-list');
            careContainer.innerHTML = '';
            data.aftercare.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                careContainer.appendChild(li);
            });

            // Configurar botón CTA de Reserva para redirigir a la página independiente
            const ctaBtn = document.getElementById('detail-cta-btn');
            if (ctaBtn) {
                ctaBtn.removeAttribute('onclick');
                ctaBtn.href = `/reservar?select=${encodeURIComponent(data.stripe_service_id)}`;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Extraer el identificador del servicio de la URL
            const params = new URLSearchParams(window.location.search);
            serviceId = params.get('id');
            const direction = params.get('dir');

            const infoBlock = document.querySelector('.service-info-block');
            if (infoBlock) {
                if (direction === 'next') {
                    infoBlock.classList.add('slide-from-right');
                } else if (direction === 'prev') {
                    infoBlock.classList.add('slide-from-left');
                }
            }

            // Si no se proporciona ID, redirigir al catálogo
            if (!serviceId) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch(`/api/services/${serviceId}`);
                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }
                originalServiceData = await response.json();
                renderServiceDetails(originalServiceData);
            } catch (error) {
                console.error('Error fetching service:', error);
                window.location.href = '/';
                return;
            }

            // Listen for language change events
            window.addEventListener('languageChanged', (e) => {
                renderServiceDetails(originalServiceData);
                // Also update dynamic title tooltips of the previous / next navigation links if they are already drawn
                updateNavigationTooltips();
            });

            let allServicesList = [];
            
            // Configurar navegación deslizable de servicios
            try {
                const servicesResponse = await fetch('/api/services');
                if (servicesResponse.ok) {
                    const groupedServices = await servicesResponse.json();
                    
                    allServicesList = [
                        ...(groupedServices.mirada || []),
                        ...(groupedServices.micropigmentacion || []),
                        ...(groupedServices.faciales || []),
                        ...(groupedServices.unas || [])
                    ];
                    
                    updateNavigationTooltips();
                }
            } catch (err) {
                console.error('Error al configurar la navegación de servicios:', err);
                document.getElementById('prev-service-link')?.remove();
                document.getElementById('next-service-link')?.remove();
            }

            function updateNavigationTooltips() {
                if (!allServicesList || allServicesList.length <= 1) {
                    document.getElementById('prev-service-link')?.remove();
                    document.getElementById('next-service-link')?.remove();
                    return;
                }
                
                const currentIndex = allServicesList.findIndex(s => s.id === serviceId);
                if (currentIndex !== -1) {
                    const prevIndex = (currentIndex - 1 + allServicesList.length) % allServicesList.length;
                    const nextIndex = (currentIndex + 1) % allServicesList.length;
                    
                    const prevService = allServicesList[prevIndex];
                    const nextService = allServicesList[nextIndex];
                    
                    const prevLink = document.getElementById('prev-service-link');
                    const nextLink = document.getElementById('next-service-link');
                    
                    const isEn = (typeof currentLanguage !== 'undefined' ? currentLanguage : (localStorage.getItem('lang') || 'es')) === 'en';
                    
                    const prevTitle = isEn && TRANSLATIONS_SERVICES[prevService.id] ? TRANSLATIONS_SERVICES[prevService.id].title : prevService.title;
                    const nextTitle = isEn && TRANSLATIONS_SERVICES[nextService.id] ? TRANSLATIONS_SERVICES[nextService.id].title : nextService.title;

                    if (prevLink) {
                        prevLink.href = `servicio.html?id=${prevService.id}&dir=prev`;
                        prevLink.title = isEn ? `Previous: ${prevTitle}` : `Anterior: ${prevService.title}`;
                    }
                    if (nextLink) {
                        nextLink.href = `servicio.html?id=${nextService.id}&dir=next`;
                        nextLink.title = isEn ? `Next: ${nextTitle}` : `Siguiente: ${nextService.title}`;
                    }
                }
            }

            // Configurar navegación por teclado (flechas izquierda / derecha)
            document.addEventListener('keydown', (e) => {
                // Evitar navegación si el usuario está escribiendo en algún formulario
                const activeTag = document.activeElement.tagName.toLowerCase();
                if (activeTag === 'input' || activeTag === 'textarea' || document.activeElement.isContentEditable) {
                    return;
                }

                if (e.key === 'ArrowLeft') {
                    const prevLink = document.getElementById('prev-service-link');
                    if (prevLink && prevLink.getAttribute('href') !== '#') {
                        prevLink.click();
                    }
                } else if (e.key === 'ArrowRight') {
                    const nextLink = document.getElementById('next-service-link');
                    if (nextLink && nextLink.getAttribute('href') !== '#') {
                        nextLink.click();
                    }
                }
            });

            // ==========================================
            // EFECTO DE TRANSICIÓN DE GALERÍA CRISTALINA
            // ==========================================
            const GALLERY_MAPPING = {
                mirada: [
                    'microblading.jpeg',
                    'microblading_2.jpeg',
                    'powder_brows.jpeg',
                    'cejas_hd.jpeg',
                    'cejas_hd_2.jpeg',
                    'laminacion_cejas.jpeg',
                    'extension_pestanas_tecnica_clasica.jpeg',
                    'extension_pestanas_volumen.jpeg',
                    'extension_pestanas_volumen_soft.jpeg',
                    'lifting_pestanas.jpeg'
                ],
                micropigmentacion: [
                    'microblading.jpeg',
                    'microblading_2.jpeg',
                    'powder_brows.jpeg',
                    'aquarela_lips_micropigmentacion.jpeg',
                    'hidratante_lips.jpeg'
                ],
                faciales: [
                    'facial_limpieza_profunda.jpeg',
                    'facial_hidratante.jpeg',
                    'facial_despigmentante.jpeg',
                    'facial_antiedad.jpeg'
                ],
                unas: [
                    'gel_semipermanente.jpeg',
                    'poligel.jpeg',
                    'ruber_base.jpeg',
                    'soft_gel.jpeg',
                    'vitamina_nail.jpeg'
                ]
            };

            let galleryImages = [];
            let currentGalleryIndex = 0;
            let galleryInterval = null;

            // Inicializar la galería para este servicio
            if (originalServiceData.image && originalServiceData.image !== "") {
                galleryImages.push(originalServiceData.image);
            }
            const catGallery = GALLERY_MAPPING[originalServiceData.category] || [];
            catGallery.forEach(img => {
                // Evitar duplicar la imagen de portada
                if (img !== originalServiceData.image && !img.includes(originalServiceData.image)) {
                    galleryImages.push(img);
                }
            });

            // Si hay más de una imagen de galería, activar el carrusel Ken Burns
            const frontImg = document.getElementById('detail-img-front');
            const imgBlock = document.querySelector('.service-image-block');
            if (galleryImages.length > 1 && imgBlock && frontImg) {
                startGallerySlideshow();
            }

            function startGallerySlideshow() {
                if (galleryInterval) clearInterval(galleryInterval);
                galleryInterval = setInterval(async () => {
                    const nextIndex = (currentGalleryIndex + 1) % galleryImages.length;
                    await triggerKenBurnsFade(galleryImages[currentGalleryIndex], galleryImages[nextIndex]);
                    currentGalleryIndex = nextIndex;
                }, 5000); // Cambiar cada 5 segundos
            }

            function triggerKenBurnsFade(fromUrl, toUrl) {
                return new Promise((resolve) => {
                    const backImg = document.getElementById('detail-img-back');
                    const frontImg = document.getElementById('detail-img-front');
                    if (!backImg || !frontImg) return resolve();

                    // 1. Cargar la nueva imagen en el fondo
                    backImg.src = toUrl;

                    // Esperar a que la imagen del fondo cargue
                    backImg.onload = () => {
                        // 2. Hacer fade out a la de adelante
                        frontImg.style.opacity = '0';

                        // 3. Cuando termine el fade (1.6s), igualar y restablecer
                        setTimeout(() => {
                            frontImg.src = toUrl;
                            frontImg.style.transition = 'none';
                            frontImg.style.opacity = '1';
                            
                            // Forzar reflujo del navegador
                            frontImg.offsetHeight;
                            
                            // Restablecer la transición
                            frontImg.style.transition = 'opacity 1.6s cubic-bezier(0.25, 1, 0.5, 1)';
                            resolve();
                        }, 1600);
                    };
                });
            }

            // Asegurar que el temporizador de la galería se destruya si salimos de la página o cambiamos de vista
            window.addEventListener('beforeunload', () => {
                if (galleryInterval) clearInterval(galleryInterval);
            });
        });
    </script>

    <!-- Script para abrir/cerrar modal en Escritorio y Procesar Formulario -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('booking-modal');
            const closeBtn = document.getElementById('booking-modal-close-btn');
            const bookingForm = document.getElementById('luxury-booking-form');
            const paymentMethodSelect = document.getElementById('booking-payment-method');
            const serviceSelect = document.getElementById('booking-service');
            const submitBtn = document.getElementById('booking-submit-btn');

            function openBookingModal(targetUrl) {
                if (!modal) return;
                
                // Reset form
                if (bookingForm) bookingForm.reset();
                
                // Pre-seleccionar el servicio actual
                if (targetUrl) {
                    try {
                        let selectVal = "";
                        if (targetUrl.includes('select=')) {
                            const params = new URLSearchParams(targetUrl.substring(targetUrl.indexOf('?')));
                            selectVal = params.get('select');
                        }
                        
                        if (selectVal && serviceSelect) {
                            let matchedValue = "";
                            for (const option of serviceSelect.options) {
                                if (option.value.toLowerCase() === selectVal.toLowerCase() || 
                                    option.value.toLowerCase().includes(selectVal.toLowerCase())) {
                                    matchedValue = option.value;
                                    break;
                                }
                            }
                            if (matchedValue) {
                                serviceSelect.value = matchedValue;
                                serviceSelect.dispatchEvent(new Event('change'));
                            }
                        }
                    } catch (e) {
                        console.error('[Modal Pre-select Error]', e);
                    }
                }
                
                modal.style.display = 'flex';
                modal.offsetHeight; // force reflow
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeBookingModal() {
                if (!modal) return;
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                }, 400);
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', closeBookingModal);
            }

            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeBookingModal();
                    }
                });
            }

            // Interceptar click en el botón de reserva principal en PC
            const mainCta = document.getElementById('detail-cta-btn');
            if (mainCta) {
                mainCta.addEventListener('click', (e) => {
                    const isMobile = window.innerWidth <= 768;
                    if (!isMobile) {
                        e.preventDefault();
                        const href = mainCta.getAttribute('href');
                        openBookingModal(href);
                    }
                });
            }

            // Interceptar clicks de los botones de WhatsApp de cabecera y drawer
            document.body.addEventListener('click', (e) => {
                const trigger = e.target.closest('.cta-button-nav, .mobile-cta-btn');
                if (trigger) {
                    e.preventDefault();
                    
                    const CONFIG = {
                        whatsappPhone: "5213222629523",
                        defaultReferral: "DIRECTO",
                        refStorageKey: "delinearte_ref_code"
                    };
                    
                    let refCode = CONFIG.defaultReferral;
                    try {
                        refCode = localStorage.getItem(CONFIG.refStorageKey) || CONFIG.defaultReferral;
                    } catch (err) {}
                    
                    const isEn = (typeof currentLanguage !== 'undefined' ? currentLanguage : (localStorage.getItem('lang') || 'es')) === 'en';
                    
                    let message = "";
                    if (isEn) {
                        message = `*DELINEARTE - DIRECT INQUIRY (WEB)*\n\n` +
                                  `*Attribution:* REF-${refCode}\n\n` +
                                  `Hello, I would like to get more information about the boutique services and check availability to book an appointment.`;
                    } else {
                        message = `*DELINEARTE - CONSULTA DIRECTA (WEB)*\n\n` +
                                  `*Atribución:* REF-${refCode}\n\n` +
                                  `Hola, me gustaría obtener más información sobre los servicios de la boutique y consultar la disponibilidad para agendar una cita.`;
                    }
                    
                    const encodedText = encodeURIComponent(message);
                    const whatsappUrl = `https://wa.me/${CONFIG.whatsappPhone}?text=${encodedText}`;
                    
                    // Enviar ping para registrar el clic a WhatsApp
                    try {
                        fetch('/api/track-whatsapp-click', { method: 'POST' });
                    } catch (err) {
                        console.error(err);
                    }
                    
                    window.open(whatsappUrl, '_blank');
                }
            });

            // --- LÓGICA DE FORMULARIO DE RESERVAS (STRIPE Y WHATSAPP) ---
            const CONFIG = {
                whatsappPhone: "5213222629523",
                defaultReferral: "DIRECTO",
                refStorageKey: "delinearte_ref_code"
            };

            function getActiveReferralCode() {
                try {
                    return localStorage.getItem(CONFIG.refStorageKey) || CONFIG.defaultReferral;
                } catch (e) {
                    return CONFIG.defaultReferral;
                }
            }

            function updateSubmitButtonText() {
                const isEn = (typeof currentLanguage !== 'undefined' ? currentLanguage : 'es') === 'en';
                if (!paymentMethodSelect || !submitBtn) return;
                if (paymentMethodSelect.value === 'stripe') {
                    submitBtn.innerHTML = isEn ? '<span>Proceed to Secure Payment</span> 💳' : '<span>Proceder al Pago Seguro</span> 💳';
                } else {
                    submitBtn.innerHTML = isEn ? '<span>Book via WhatsApp</span> 👑' : '<span>Reservar por WhatsApp</span> 👑';
                }
            }

            if (paymentMethodSelect && submitBtn) {
                paymentMethodSelect.addEventListener('change', updateSubmitButtonText);
            }

            if (serviceSelect && paymentMethodSelect) {
                serviceSelect.addEventListener('change', () => {
                    const stripeOption = paymentMethodSelect.querySelector('option[value="stripe"]');
                    const freeServices = ['Micropigmentación de Cejas', 'Plasma Fibroblast', 'Aquarela Lips', 'Full Lips', 'Eyeliner'];
                    if (freeServices.includes(serviceSelect.value)) {
                        paymentMethodSelect.value = 'whatsapp';
                        if (stripeOption) stripeOption.disabled = true;
                    } else {
                        if (stripeOption) stripeOption.disabled = false;
                        paymentMethodSelect.value = 'stripe';
                    }
                    updateSubmitButtonText();
                });
            }

            window.addEventListener('languageChanged', () => {
                updateSubmitButtonText();
            });

            if (bookingForm) {
                bookingForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const isEn = (typeof currentLanguage !== 'undefined' ? currentLanguage : 'es') === 'en';
                    const name = document.getElementById('booking-name').value.trim();
                    const phone = document.getElementById('booking-phone').value.trim();
                    const service = serviceSelect.value;
                    const date = document.getElementById('booking-date').value;
                    const time = document.getElementById('booking-time').value;
                    const notes = document.getElementById('booking-notes').value.trim() || (isEn ? 'No additional notes' : 'Sin notas adicionales');
                    const paymentMethod = paymentMethodSelect ? paymentMethodSelect.value : 'stripe';
                    
                    if (!name || !phone || !service || !date || !time) {
                        alert(isEn ? 'Please fill out all required fields for your reservation.' : 'Por favor, rellene todos los campos obligatorios para su reserva.');
                        return;
                    }

                    if (paymentMethod === 'stripe') {
                        if (submitBtn) {
                            submitBtn.innerHTML = isEn ? '<span>Initiating Secure Payment...</span>' : '<span>Iniciando Pago Seguro...</span>';
                            submitBtn.disabled = true;
                            submitBtn.style.opacity = '0.7';
                        }
                        try {
                            const response = await fetch('/api/create-checkout-session', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name, phone, service, date, time, notes, origin: window.location.origin })
                            });
                            const data = await response.json();
                            if (!response.ok) throw new Error(data.error || 'Error al generar sesión de pago');
                            if (submitBtn) submitBtn.innerHTML = isEn ? '<span>Redirecting to Stripe...</span> 🔒' : '<span>Redirigiendo a Stripe...</span> 🔒';
                            window.location.href = data.url;
                        } catch (err) {
                            console.error('[Stripe Redirect Error]', err);
                            alert(isEn ? `Sorry, we could not process card payment: ${err.message}. Attempting to book via WhatsApp fallback.` : `Lo sentimos, no pudimos procesar el pago con tarjeta: ${err.message}. Intentando agendar por WhatsApp de respaldo.`);
                            if (submitBtn) {
                                submitBtn.disabled = false;
                                submitBtn.style.opacity = '1';
                                updateSubmitButtonText();
                            }
                        }
                    } else {
                        const referralCode = getActiveReferralCode();
                        const leadId = 'LL-' + Math.floor(1000 + Math.random() * 9000);
                        let message = '';
                        if (isEn) {
                            message = `*DELINEARTE - NEW BOOKING (BOUTIQUE)*\n\n` +
                                      `*Client:* ${name}\n` +
                                      `*Phone:* ${phone}\n` +
                                      `*Service:* ${service}\n` +
                                      `*Date:* ${date}\n` +
                                      `*Time:* ${time}\n` +
                                      `*Notes:* ${notes}\n\n` +
                                      `---------------------------------\n` +
                                      `*Lead Code:* ${leadId}\n` +
                                      `*Attribution:* REF-${referralCode}\n` +
                                      `_Appointment request for in-boutique payment_`;
                        } else {
                            message = `*DELINEARTE - NUEVA RESERVA (SUCURSAL)*\n\n` +
                                      `*Cliente:* ${name}\n` +
                                      `*Teléfono:* ${phone}\n` +
                                      `*Servicio:* ${service}\n` +
                                      `*Fecha:* ${date}\n` +
                                      `*Hora:* ${time}\n` +
                                      `*Notas:* ${notes}\n\n` +
                                      `---------------------------------\n` +
                                      `*Código de Lead:* ${leadId}\n` +
                                      `*Atribución:* REF-${referralCode}\n` +
                                      `_Solicitud de cita para pago en boutique_`;
                        }
                        const encodedText = encodeURIComponent(message);
                        const whatsappUrl = `https://wa.me/${CONFIG.whatsappPhone}?text=${encodedText}`;
                        if (submitBtn) {
                            const originalText = submitBtn.innerHTML;
                            submitBtn.innerHTML = isEn ? '<span>Generating Link...</span>' : '<span>Generando Enlace...</span>';
                            submitBtn.style.opacity = '0.7';
                            setTimeout(() => {
                                submitBtn.innerHTML = isEn ? '<span>Redirecting to WhatsApp!</span>' : '<span>¡Redirigiendo a WhatsApp!</span>';
                                window.open(whatsappUrl, '_blank');
                                setTimeout(() => {
                                    submitBtn.innerHTML = originalText;
                                    submitBtn.style.opacity = '1';
                                    bookingForm.reset();
                                    updateSubmitButtonText();
                                }, 2000);
                            }, 1000);
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
